server:
  port: ${SERVER_PORT:8081}
hmdp:
  upload-dir: ${HMDP_UPLOAD_DIR:${user.dir}/.local/uploads}
spring:
  application:
    name: hmdp-pro
  datasource:
    driver-class-name: com.mysql.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:13306}/${MYSQL_DATABASE:hmdp}?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=UTF-8
    username: ${MYSQL_USER:hmdp}
    password: ${MYSQL_PASSWORD}
  redis:
    host: ${REDIS_HOST:127.0.0.1}
    port: ${REDIS_PORT:16379}
    password: ${REDIS_PASSWORD:}
    lettuce:
      pool:
        max-active: 10
        max-idle: 10
        min-idle: 1
        time-between-eviction-runs: 10s
  jackson:
    default-property-inclusion: non_null # JSON处理时忽略非空字段
mybatis-plus:
  type-aliases-package: com.hmdp.entity # 别名扫描包
# ===== Java 缓存重建（初始值需结合连接池容量及压测调整） =====
cache:
  shop:
    local-ttl-seconds: ${SHOP_LOCAL_TTL_SECONDS:60}
    redis-logical-ttl-seconds: ${SHOP_REDIS_LOGICAL_TTL_SECONDS:300}
  rebuild:
    lock-wait-ms: 200
    threads: 10
    queue-capacity: 200
    shutdown-wait-seconds: 5
# ===== RocketMQ 消息队列 =====
rocketmq:
  name-server: ${ROCKETMQ_NAME_SERVER:127.0.0.1:9876}
  order:
    max-reconsume-times: ${ORDER_MAX_RECONSUME_TIMES:3}
# ===== 唯一秒杀链路：半消息 → Lua 预扣和成功标记 → 事务落库 =====
seckill:
  transaction:
    marker-ttl-seconds: ${SECKILL_TX_MARKER_TTL_SECONDS:86400}
    check-grace-ms: ${SECKILL_TX_CHECK_GRACE_MS:60000}
  compensation:
    poll-ms: 5000
    batch-size: 100
    max-attempts: 10
    lease-seconds: 60
    retry-base-seconds: 30
    retry-max-seconds: 600
  # 仅秒杀 POST 提交按用户限流，不限制系统总 QPS
  rate-limit:
    sliding-window:
      enabled: true
      window-ms: 1000      # 窗口 1 秒
      max-requests: 5      # 同一用户窗口内最多 5 次秒杀请求
logging:
  level:
    com.hmdp: info
